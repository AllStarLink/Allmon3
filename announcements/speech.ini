[speech]
; asl3-tts supplies the default runtime and Amy voice. No manual venv is required.
; Select an additional installed model by changing voice, e.g. en_US-ryan-medium.
voice = en_US-amy-low
model_dir = /var/lib/piper-tts
piper_bin = /usr/bin/piper
backend = asl3
length_scale = 1.25
volume = 0.8
sentence_silence = 0.18
gain = 4/3
limiter = 0.95
